<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>원자재 가격 모니터링</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

  <!-- CSV Parser -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body class="bg-neutral-900 text-gray-100">

<div class="flex h-screen">

  <!-- Sidebar -->
  <aside class="w-64 bg-neutral-800 p-4">
    <h2 class="text-lg font-bold mb-6">원자재 가격 모니터링</h2>
    <ul class="space-y-3 text-sm">
      <li class="text-blue-400">종합 대시보드</li>
      <li class="text-gray-400">철강 가격 정보</li>
      <li class="text-gray-400">비철금속 가격 정보</li>
      <li class="text-gray-400">유가 정보</li>
      <li class="text-gray-400">금융 정보</li>
    </ul>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-6 overflow-y-auto">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-xl font-bold">종합 대시보드</h1>
      <span class="text-sm text-gray-400">최종 업데이트 시간: 2025-12-30</span>
    </div>

    <!-- KPI Cards -->
    <div id="kpi" class="grid grid-cols-1 md:grid-cols-6 gap-4 mb-6"></div>

    <!-- Charts -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <div class="md:col-span-2 bg-neutral-800 rounded-xl p-4">
        <h3 class="text-sm mb-2">최근 30일 원달러 환율</h3>
        <div id="fxChart" class="h-64"></div>
      </div>

      <div class="bg-neutral-800 rounded-xl p-4">
        <h3 class="text-sm mb-2">최근 3개월 철강 가격 변화</h3>
        <div id="steelChart" class="h-64"></div>
      </div>

    </div>

  </main>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
