name: Daily Data Update

on:
    schedule:
        - cron: "50 2 * * *"
    workflow_dispatch:

jobs:
    update-data:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.x"

            - name: Install dependencies
              run: |
                  pip install requests beautifulsoup4

            - name: Run data collection script
              env:
                  KOREA_BANK_API_KEY: ${{ secrets.KOREA_BANK_API_KEY }}
                  OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
                  PUBLIC_DATA_CENTER_API_KEY: ${{ secrets.PUBLIC_DATA_CENTER_API_KEY }}
                  LME_PRICE_BOARD_URL: ${{ secrets.LME_PRICE_BOARD_URL }}
                  LME_PRICE_LIST_URL: ${{ secrets.LME_PRICE_LIST_URL }}
              run: |
                  python collector.py

            - name: Commit and push if changes
              run: |
                  git config user.name "ko-hoon"
                  git config user.email "seunghoon_jeon@kolon.com"
                  git add .
                  git diff --quiet && git diff --staged --quiet || (git commit -m "데이터 업데이트: $(date +'%Y-%m-%d')" && git push)
