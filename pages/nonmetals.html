<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>비철금속 가격 정보 - 원자재 가격 모니터링</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.mini.min.js"></script>
        <link rel="icon" type="image/svg+xml" href="/images/icon.svg" />
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
            rel="stylesheet"
        />
        <style>
            @import url("https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css");

            * {
                font-family: "SUIT", -apple-system, BlinkMacSystemFont,
                    "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR",
                    sans-serif;
            }
            .sidebar {
                background: rgba(50, 50, 50, 1);
            }

            .sidebar-item {
                transition: all 0.2s ease;
            }

            .sidebar-item:hover {
                background: rgba(0, 0, 0, 0.1);
            }

            .sidebar-item.active {
                background: rgba(255, 255, 255, 1);
                color: rgba(59, 130, 246, 1);
                font-weight: 600;
            }
        </style>
    </head>
    <body class="bg-gray-100">
        <div class="flex h-screen overflow-hidden">
            <!-- 사이드바 -->
            <aside class="sidebar w-64 flex-shrink-0 hidden 2xl:block">
                <div class="h-full flex flex-col">
                    <div class="p-6">
                        <h1 class="text-white text-lg font-normal">
                            원자재 가격 모니터링 시스템
                        </h1>
                        <div
                            class="border-b border-white/20 pb-4 text-center"
                        ></div>

                        <nav class="flex-1 pt-4 space-y-2">
                            <a
                                href="../index.html"
                                class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300"
                            >
                                <span class="material-icons-round nav-icon"
                                    >home</span
                                >
                                <span>종합 대시보드</span>
                            </a>
                            <a
                                href="metals.html"
                                class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300"
                            >
                                <span class="material-icons-round nav-icon"
                                    >show_chart</span
                                >
                                <span>철강 가격 정보</span>
                            </a>
                            <a
                                href="nonmetals.html"
                                class="sidebar-item active flex items-center space-x-3 px-4 py-3 rounded-lg text-white"
                            >
                                <span class="material-icons-round nav-icon"
                                    >factory</span
                                >
                                <span>비철금속 가격 정보</span>
                            </a>
                            <a
                                href="oil.html"
                                class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300"
                            >
                                <span class="material-icons-round nav-icon"
                                    >local_gas_station</span
                                >
                                <span>유가 정보</span>
                            </a>
                            <a
                                href="exchange.html"
                                class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300"
                            >
                                <span class="material-icons-round nav-icon"
                                    >payments</span
                                >
                                <span>금융 정보</span>
                            </a>
                        </nav>
                    </div>
                </div>
            </aside>

            <!-- 메인 컨텐츠 -->

            <main class="flex-1 overflow-y-auto pb-20 md:pb-0">
                <div class="p-6">
                    <div class="mb-3 md:mb-6">
                        <h2
                            class="text-base md:text-2xl font-bold text-gray-800"
                        >
                            비철금속 가격 정보
                        </h2>
                        <p class="text-gray-500 text-sm md:text-base mt-1">
                            구리, 알루미늄, 아연, 납, 니켈, 주석 가격 추이 (최근
                            30일)
                        </p>
                    </div>
                    <!-- 날짜 필터 -->
                    <div id="nonmetal-date-filter"></div>

                    <!-- 차트 -->
                    <div class="bg-white rounded-lg shadow-sm p-3 md:p-6 mb-6">
                        <div style="height: 400px">
                            <canvas id="nonmetalChart"></canvas>
                        </div>
                    </div>

                    <!-- 데이터 테이블 -->
                    <div class="bg-white rounded-lg shadow-sm p-3 md:p-6">
                        <div
                            class="flex justify-between items-center mb-2 md:mb-4"
                        >
                            <h3 class="text-lg font-semibold text-gray-800">
                                최근 데이터
                            </h3>
                            <button
                                id="download-nonmetal-excel"
                                class="px-2 md:px-4 py-2 bg-[#217346] hover:bg-[#1e6a3f] text-white rounded-lg text-sm text-center"
                            >
                                Excel 다운로드
                            </button>
                        </div>
                        <div id="nonmetal-table"></div>
                    </div>
                </div>
            </main>
        </div>

        <!-- 모바일 하단 네비게이션 -->
        <nav
            class="2xl:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-2"
        >
            <div class="flex justify-around">
                <a
                    href="../index.html"
                    class="flex flex-col items-center py-2 text-gray-400"
                >
                    <span class="material-icons-round">home</span>
                    <span class="text-xs mt-1">홈</span>
                </a>
                <a
                    href="metals.html"
                    class="flex flex-col items-center py-2 text-blue-600"
                >
                    <span class="material-icons-round">show_chart</span>
                    <span class="text-xs mt-1">철강</span>
                </a>
                <a
                    href="nonmetals.html"
                    class="flex flex-col items-center py-2 text-gray-400"
                >
                    <span class="material-icons-round">factory</span>
                    <span class="text-xs mt-1">비철금속</span>
                </a>
                <a
                    href="oil.html"
                    class="flex flex-col items-center py-2 text-gray-400"
                >
                    <span class="material-icons-round">local_gas_station</span>
                    <span class="text-xs mt-1">유가</span>
                </a>
                <a
                    href="exchange.html"
                    class="flex flex-col items-center py-2 text-gray-400"
                >
                    <span class="material-icons-round">payments</span>
                    <span class="text-xs mt-1">금융</span>
                </a>
            </div>
        </nav>
        <script src="../js/main.js"></script>
        <script src="../js/date-filter.js"></script>
        <script src="../js/excel-download.js"></script>
        <script src="../js/data-loader.js"></script>
        <script src="../js/charts.js"></script>
        <script>
            let nonmetalDataCache = null; // 전체 데이터 캐시
            let filteredNonMetalData = null; // 현재 필터링된 데이터
            let dateFilter = null;
            let currentDateRange = null; // 현재 날짜 범위 저장

            // 데이터 필터링 및 차트/테이블 업데이트
            function updateNonMetalDisplay(dateRange) {
                if (!nonmetalDataCache) return;

                currentDateRange = dateRange;

                // 날짜 범위로 데이터 필터링
                filteredNonMetalData = filterDataByDateRange(
                    nonmetalDataCache,
                    dateRange.startDate,
                    dateRange.endDate,
                    "일자"
                );

                console.log(
                    "필터링된 데이터:",
                    filteredNonMetalData.length,
                    "건"
                );

                // 차트 업데이트
                createNonMetalChart(filteredNonMetalData);

                // 테이블은 필터링된 데이터의 최근 10개 표시
                createNonMetalTable(filteredNonMetalData);
            }

            // Excel 다운로드 함수
            function downloadNonMetalExcel() {
                if (
                    !filteredNonMetalData ||
                    filteredNonMetalData.length === 0
                ) {
                    alert("다운로드할 데이터가 없습니다.");
                    return;
                }

                console.log(
                    "다운로드할 데이터:",
                    filteredNonMetalData.length,
                    "건"
                );
                console.log("첫번째 행:", filteredNonMetalData[0]);

                // 데이터 준비 - CSV의 실제 컬럼명 사용
                const preparedData = filteredNonMetalData.map((row) => {
                    return {
                        날짜: formatDate(row["일자"]),
                        "구리 (달러/톤)":
                            parseFloat(row["구리 (달러/톤)"]) || 0,
                        "알루미늄 (달러/톤)":
                            parseFloat(row["알루미늄 (달러/톤)"]) || 0,
                        "아연 (달러/톤)":
                            parseFloat(row["아연 (달러/톤)"]) || 0,
                        "납 (달러/톤)": parseFloat(row["납 (달러/톤)"]) || 0,
                        "니켈 (달러/톤)":
                            parseFloat(row["니켈 (달러/톤)"]) || 0,
                        "주석 (달러/톤)":
                            parseFloat(row["주석 (달러/톤)"]) || 0,
                    };
                });

                // 통계 정보와 함께 다운로드
                downloadWithStatistics(
                    preparedData,
                    "비철금속가격정보",
                    "비철금속가격데이터",
                    currentDateRange
                );
            }

            window.addEventListener("DOMContentLoaded", async () => {
                // SheetJS 라이브러리 확인
                if (typeof XLSX === "undefined") {
                    console.error("SheetJS 라이브러리가 로드되지 않았습니다.");
                    alert(
                        "Excel 다운로드 기능을 사용할 수 없습니다. 페이지를 새로고침해주세요."
                    );
                    return;
                }

                // 데이터 로드
                console.log("데이터 로딩 시작...");
                nonmetalDataCache = await loadCSV("daily_no_metal_data.csv");
                console.log(
                    "로드된 전체 데이터:",
                    nonmetalDataCache.length,
                    "건"
                );
                console.log("첫번째 행:", nonmetalDataCache[0]);

                if (!nonmetalDataCache || nonmetalDataCache.length === 0) {
                    alert("데이터를 불러올 수 없습니다.");
                    return;
                }

                // 날짜 필터 초기화
                dateFilter = new DateRangeFilter("nonmetal-date-filter", {
                    defaultRange: "1Y",
                    onFilter: (dateRange) => {
                        console.log("필터 변경:", dateRange);
                        updateNonMetalDisplay(dateRange);
                    },
                    customRanges: {
                        "3M": { label: "3개월", months: 3 },
                        "6M": { label: "6개월", months: 6 },
                        "1Y": { label: "1년", months: 12 },
                        "3Y": { label: "3년", months: 36 },
                        ALL: { label: "전체", months: null },
                    },
                });

                // 초기 표시
                updateNonMetalDisplay(dateFilter.getDateRange());

                // Excel 다운로드 버튼 이벤트
                const downloadBtn = document.getElementById(
                    "download-nonmetal-excel"
                );
                if (downloadBtn) {
                    downloadBtn.addEventListener(
                        "click",
                        downloadNonMetalExcel
                    );
                }
            });
        </script>
    </body>
</html>
