<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>철강 가격 정보 - 원자재 가격 모니터링</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
        * { font-family: 'Noto Sans KR', sans-serif; }
        .sidebar { background: #2c2c3e; }
        .sidebar-item { transition: all 0.2s ease; }
        .sidebar-item:hover { background: rgba(102, 126, 234, 0.1); }
        .sidebar-item.active { background: #667eea; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
        <!-- 사이드바 -->
        <aside class="sidebar w-64 flex-shrink-0 hidden md:block">
            <div class="h-full flex flex-col">
                <div class="p-6 border-b border-gray-700">
                    <h1 class="text-white text-xl font-bold">원자재 가격 모니터링 시스템</h1>
                </div>
                <nav class="flex-1 p-4 space-y-2">
                    <a href="../index.html" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300">
                        <i class="fas fa-home w-5"></i><span>종합 대시보드</span>
                    </a>
                    <a href="metals.html" class="sidebar-item active flex items-center space-x-3 px-4 py-3 rounded-lg text-white">
                        <i class="fas fa-chart-line w-5"></i><span>철강 가격 정보</span>
                    </a>
                    <a href="nonmetals.html" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300">
                        <i class="fas fa-industry w-5"></i><span>비철금속 가격 정보</span>
                    </a>
                    <a href="oil.html" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300">
                        <i class="fas fa-gas-pump w-5"></i><span>유가 정보</span>
                    </a>
                    <a href="exchange.html" class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300">
                        <i class="fas fa-dollar-sign w-5"></i><span>금융 정보</span>
                    </a>
                </nav>
                <div class="p-4 border-t border-gray-700 text-gray-400 text-xs">
                    <p id="lastUpdate">최종 업데이트: -</p>
                </div>
            </div>
        </aside>

        <!-- 메인 컨텐츠 -->
        <main class="flex-1 overflow-y-auto pb-20 md:pb-0">
            <div class="md:hidden bg-white border-b border-gray-200 p-4">
                <h1 class="text-lg font-bold text-gray-800">철강 가격 정보</h1>
            </div>
            
            <div class="p-6 md:p-8">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">철강 가격 정보</h2>
                    <p class="text-gray-500 text-sm mt-1">철근, 철광석, 유연탄, 스크랩 가격 추이</p>
                </div>

                <!-- 차트 -->
                <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">철강 원자재 가격 추이</h3>
                    <div style="height: 400px;">
                        <canvas id="metalChart"></canvas>
                    </div>
                </div>

                <!-- 데이터 테이블 -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold text-gray-800">최근 데이터</h3>
                        <button onclick="downloadCSV('monthly_metal_data.csv')" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm">
                            <i class="fas fa-download mr-2"></i>CSV 다운로드
                        </button>
                    </div>
                    <div id="metal-table"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 모바일 하단 네비게이션 -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-2">
        <div class="flex justify-around">
            <a href="../index.html" class="flex flex-col items-center py-2 text-gray-400">
                <i class="fas fa-home text-xl"></i><span class="text-xs mt-1">홈</span>
            </a>
            <a href="metals.html" class="flex flex-col items-center py-2 text-purple-600">
                <i class="fas fa-chart-line text-xl"></i><span class="text-xs mt-1">철강</span>
            </a>
            <a href="nonmetals.html" class="flex flex-col items-center py-2 text-gray-400">
                <i class="fas fa-industry text-xl"></i><span class="text-xs mt-1">비철금속</span>
            </a>
            <a href="oil.html" class="flex flex-col items-center py-2 text-gray-400">
                <i class="fas fa-gas-pump text-xl"></i><span class="text-xs mt-1">유가</span>
            </a>
        </div>
    </nav>

    <script src="../js/main.js"></script>
    <script src="../js/data-loader.js"></script>
    <script src="../js/charts.js"></script>
    <script>
        function downloadCSV(filename) {
            const link = document.createElement('a');
            link.href = `../data/${filename}`;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadMetalData();
        });
    </script>
</body>
</html>
