<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>원자재 가격 모니터링 시스템</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
            rel="stylesheet"
        />
        <style>
            @import url("https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css");

            * {
                font-family: "SUIT", -apple-system, BlinkMacSystemFont,
                    "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR",
                    sans-serif;
            }

            .card-hover {
                transition: all 0.3s ease;
            }

            .card-hover:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            }

            .sidebar {
                background: rgba(50, 50, 50, 1);
            }

            .sidebar-item {
                transition: all 0.2s ease;
            }

            .sidebar-item:hover {
                background: rgba(25, 25, 25, 0.1);
            }

            .sidebar-item.active {
                background: rgba(25, 25, 25, 1);
            }

            .metric-card {
                background: white;
                border-radius: 12px;
                padding: 20px;
            }

            .metric-icon-small {
                width: 48px;
                height: 48px;
                display: flex;
                align-items: center;
                justify-content: left;
                margin-bottom: 10px;
            }

            .metric-icon {
                width: 48px;
                height: 48px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 12px;
            }

            .material-symbols-rounded {
                font-size: 32px;
            }
        </style>
    </head>
    <body class="bg-gray-100">
        <div class="flex h-screen overflow-hidden">
            <!-- 사이드바 -->
            <aside class="sidebar w-64 flex-shrink-0 hidden 2xl:block">
                <div class="h-full flex flex-col">
                    <div class="p-6 border-b border-gray-700">
                        <h1
                            class="text-white text-lg font-regular items-center justify-center"
                        >
                            원자재 가격 모니터링 시스템
                        </h1>
                    </div>

                    <nav class="flex-1 p-4 space-y-2">
                        <a
                            href="index.html"
                            class="sidebar-item active flex items-center space-x-3 px-4 py-3 rounded-lg text-white"
                        >
                            <i class="fas fa-home w-5"></i>
                            <span>종합 대시보드</span>
                        </a>
                        <a
                            href="pages/metals.html"
                            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300"
                        >
                            <i class="fas fa-chart-line w-5"></i>
                            <span>철강 가격 정보</span>
                        </a>
                        <a
                            href="pages/nonmetals.html"
                            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300"
                        >
                            <i class="fas fa-industry w-5"></i>
                            <span>비철금속 가격 정보</span>
                        </a>
                        <a
                            href="pages/oil.html"
                            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300"
                        >
                            <i class="fas fa-gas-pump w-5"></i>
                            <span>유가 정보</span>
                        </a>
                        <a
                            href="pages/exchange.html"
                            class="sidebar-item flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300"
                        >
                            <i class="fas fa-dollar-sign w-5"></i>
                            <span>금융 정보</span>
                        </a>
                    </nav>

                    <div
                        class="p-4 border-t border-gray-700 text-gray-400 text-xs"
                    >
                        <p id="lastUpdate">최종 업데이트: -</p>
                    </div>
                </div>
            </aside>

            <!-- 메인 컨텐츠 -->
            <main class="flex-1 overflow-y-auto pb-20 md:pb-0">
                <div class="p-6 md:p-8">
                    <!-- 메트릭 카드 그리드 -->
                    <div
                        class="grid grid-cols-2 md:grid-cols-6 2xl:grid-cols-10 gap-4 mb-6"
                    >
                        <!-- 금리 -->
                        <div
                            class="metric-card card-hover bg-blue-500 text-white col-span-2 md:col-span-2 2xl:col-span-1"
                        >
                            <div class="metric-icon-small">
                                <span class="material-symbols-rounded"
                                    >percent</span
                                >
                            </div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-sm font-medium"
                                    >기준금리</span
                                >
                            </div>
                            <div
                                class="text-2xl font-bold"
                                id="interest-rate"
                            ></div>
                            <div class="text-xs mt-2" id="interest-date"></div>
                        </div>
                        <!-- KORIBOR -->
                        <div
                            class="metric-card card-hover bg-red-500 text-white col-span-2 md:col-span-2 2xl:col-span-1"
                        >
                            <div class="metric-icon-small">
                                <span class="material-symbols-rounded"
                                    >account_balance</span
                                >
                            </div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-sm font-medium">KORIBOR</span>
                            </div>
                            <div
                                class="text-2xl font-bold"
                                id="koribor-rate"
                            ></div>
                            <div class="text-xs mt-2" id="koribor-date"></div>
                        </div>

                        <!-- 유가 -->
                        <div class="metric-card card-hover col-span-2">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-gray-500 text-sm font-medium"
                                    >유가</span
                                >
                                <div
                                    class="metric-icon bg-orange-100 text-orange-600"
                                >
                                    <span class="material-symbols-rounded"
                                        >local_gas_station</span
                                    >
                                </div>
                            </div>
                            <div
                                class="text-2xl font-bold text-gray-800"
                                id="oil-price"
                            >
                                -
                            </div>
                            <div
                                class="text-xs text-gray-400 mt-2"
                                id="oil-date"
                            >
                                -
                            </div>
                        </div>

                        <!-- 구리 -->
                        <div class="metric-card card-hover col-span-2">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-gray-500 text-sm font-medium"
                                    >구리 (달러/톤)</span
                                >
                                <div
                                    class="metric-icon bg-amber-100 text-amber-600"
                                >
                                    <span class="material-symbols-rounded"
                                        >radio_button_unchecked</span
                                    >
                                </div>
                            </div>
                            <div
                                class="text-2xl font-bold text-gray-800"
                                id="copper-price"
                            >
                                -
                            </div>
                            <div
                                class="text-xs text-gray-400 mt-2"
                                id="copper-date"
                            >
                                -
                            </div>
                        </div>
                        <!-- 유가 -->
                        <div class="metric-card card-hover col-span-2">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-gray-500 text-sm font-medium"
                                    >전국 평균 유가</span
                                >
                                <div
                                    class="metric-icon bg-orange-100 text-orange-600"
                                >
                                    <span class="material-symbols-rounded"
                                        >view_in_ar</span
                                    >
                                </div>
                            </div>
                            <div
                                class="text-2xl font-bold text-gray-800"
                                id="oil-price"
                            >
                                -
                            </div>
                            <div
                                class="text-xs text-gray-400 mt-2"
                                id="oil-date"
                            >
                                -
                            </div>
                        </div>

                        <!-- 구리 -->
                        <div class="metric-card card-hover col-span-2">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-gray-500 text-sm font-medium"
                                    >구리 (달러/톤)</span
                                >
                                <div
                                    class="metric-icon bg-amber-100 text-amber-600"
                                >
                                    <span class="material-symbols-rounded"
                                        >layers</span
                                    >
                                </div>
                            </div>
                            <div
                                class="text-2xl font-bold text-gray-800"
                                id="copper-price"
                            >
                                -
                            </div>
                            <div
                                class="text-xs text-gray-400 mt-2"
                                id="copper-date"
                            >
                                -
                            </div>
                        </div>
                    </div>

                    <!-- 차트 그리드 -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- 최근 30일 환율 추이 -->
                        <div class="bg-white rounded-lg shadow-sm p-6">
                            <h3
                                class="text-lg font-semibold text-gray-800 mb-4"
                            >
                                최근 30일 환율 추이
                            </h3>
                            <div style="height: 300px">
                                <canvas id="exchangeTrendChart"></canvas>
                            </div>
                        </div>

                        <!-- 최근 3개월 철강 가격 변화 -->
                        <div class="bg-white rounded-lg shadow-sm p-6">
                            <h3
                                class="text-lg font-semibold text-gray-800 mb-4"
                            >
                                최근 3개월 철강 가격 변화
                            </h3>
                            <div style="height: 300px">
                                <canvas id="metalTrendChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- 모바일 하단 네비게이션 -->
        <nav
            class="2xl:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-2"
        >
            <div class="flex justify-around">
                <a
                    href="index.html"
                    class="flex flex-col items-center py-2 text-blue-600"
                >
                    <i class="fas fa-home text-xl"></i
                    ><span class="text-xs mt-1">홈</span>
                </a>
                <a
                    href="pages/metals.html"
                    class="flex flex-col items-center py-2 text-gray-400"
                >
                    <i class="fas fa-chart-line text-xl"></i
                    ><span class="text-xs mt-1">철강</span>
                </a>
                <a
                    href="pages/nonmetals.html"
                    class="flex flex-col items-center py-2 text-gray-400"
                >
                    <i class="fas fa-industry text-xl"></i
                    ><span class="text-xs mt-1">비철금속</span>
                </a>
                <a
                    href="pages/oil.html"
                    class="flex flex-col items-center py-2 text-gray-400"
                >
                    <i class="fas fa-gas-pump text-xl"></i
                    ><span class="text-xs mt-1">유가</span>
                </a>
                <a
                    href="pages/exchange.html"
                    class="flex flex-col items-center py-2 text-gray-400"
                >
                    <i class="fas fa-dollar-sign text-xl"></i
                    ><span class="text-xs mt-1">금융</span>
                </a>
            </div>
        </nav>

        <!-- 스크립트는 순서대로 로드 -->
        <script src="js/main.js"></script>
        <script src="js/charts.js"></script>
        <script src="js/data-loader.js"></script>
        <script>
            // DOM 로드 완료 후 실행
            window.addEventListener("DOMContentLoaded", async () => {
                try {
                    await loadDashboardData();
                    await loadDashboardCharts();
                } catch (error) {
                    console.error("데이터 로드 실패:", error);
                }
            });
        </script>
    </body>
</html>
